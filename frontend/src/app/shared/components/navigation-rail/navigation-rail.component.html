<nav class="navigation-rail">
  <div class="menu-fab">
    <a *ngIf="logoUrl" [routerLink]="logoUrl" routerLinkActive="active" class="nav-brand-logo">
      <mat-icon *ngIf="!logoUrl" class="default-logo">school</mat-icon>
      <mat-icon *ngIf="logoUrl" class="brand-logo" svgIcon="logo_SQLearner"></mat-icon>
    </a>
  </div>

  <div class="segment">
    <a
      *ngFor="let item of items"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="nav-item"
      (click)="onItemClick(item)"
    >
      <span class="icon-container">
        <mat-icon>{{ item.icon }}</mat-icon>
      </span>
      <span class="label-text">{{ item.label | translate }}</span>
    </a>
  </div>

  <div class="nav-footer">
    <div class="language-switcher">
      <button class="lang-btn" (click)="onLanguageChange('de')" [class.active]="currentLang === 'de'">
        🇩🇪
      </button>
      <button class="lang-btn" (click)="onLanguageChange('en')" [class.active]="currentLang === 'en'">
        🇬🇧
      </button>
    </div>

    <button class="nav-item" *ngIf="userRole; else loginBtn" (click)="openProfile()">
      <span class="icon-container">
        <mat-icon>person</mat-icon>
      </span>
      <span class="label-text">{{ 'PROFILE' | translate }}</span>
    </button>
    <ng-template #loginBtn>
      <button class="nav-item" (click)="onLogStatusChanged()">
        <span class="icon-container">
          <mat-icon>login</mat-icon>
        </span>
        <span class="label-text">{{ 'LOGIN' | translate }}</span>
      </button>
    </ng-template>

    <button class="nav-item">
      <span class="icon-container">
        <mat-icon>dark_mode</mat-icon>
      </span>
      <span class="label-text">Dark/Light</span>
    </button>
  </div>
</nav>
