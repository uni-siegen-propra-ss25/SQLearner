<mat-sidenav-container class="app-container" [class.dark-theme]="themeIsDark">
  <mat-sidenav fixedInViewport opened mode="side" class="sidenav">
    <app-navigation-rail
      [items]="currentUserNavigationItems"
      [userRole]="currentUserRole"
      logoAlt="SQLearner Logo"
      (itemSelected)="onNavigationItemSelected($event)"
      (languageChanged)="onLanguageChanged($event)"
      (logStatusChanged)="onLogStatusChanged()"
      [isDarkTheme]="themeIsDark"
      (themeChanged)="onThemeChanged($event)"
    >
    </app-navigation-rail>
  </mat-sidenav>

  <mat-sidenav-content class="sidenav-content">
    <div class="sidenav-content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
