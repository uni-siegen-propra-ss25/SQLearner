<h2 mat-dialog-title>{{ 'DATABASE_UPLOAD_DIALOG.TITLE' | translate }}</h2>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <div style="display: flex; flex-direction: column; gap: 24px;">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>{{ 'DATABASE_UPLOAD_DIALOG.NAME' | translate }}</mat-label>
        <input matInput formControlName="name" required />
        <mat-error *ngIf="form.get('name')?.hasError('required')">
          {{ 'DATABASE_UPLOAD_DIALOG.NAME_REQUIRED' | translate }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>{{ 'DATABASE_UPLOAD_DIALOG.DESCRIPTION' | translate }}</mat-label>
        <textarea matInput formControlName="description" rows="3"></textarea>
      </mat-form-field>
    </div>

    <div class="file-upload">
      <input type="file" (change)="onFileSelected($event)" accept=".sql" #fileInput hidden />
      <div class="file-drop-area" (click)="fileInput.click()" (drop)="onFileDrop($event)" (dragover)="$event.preventDefault()">
        <mat-icon>upload_file</mat-icon>
        <span *ngIf="!selectedFile">SQL Datei hierher ziehen oder klicken, um auszuwählen</span>
        <span class="file-name" *ngIf="selectedFile">{{ selectedFile.name }}
          <button mat-icon-button type="button" (click)="removeFile($event)"><mat-icon>close</mat-icon></button>
        </span>
      </div>
    </div>
  </mat-dialog-content>

  <div class="dialog-actions" align="end">
    <button mat-button type="button" (click)="onCancel()">{{ 'DATABASE_UPLOAD_DIALOG.CANCEL' | translate }}</button>
    <button
      mat-raised-button
      color="primary"
      type="submit"
      [disabled]="!form.valid || !selectedFile"
    >
      {{ 'DATABASE_UPLOAD_DIALOG.UPLOAD' | translate }}
    </button>
  </div>
</form>
