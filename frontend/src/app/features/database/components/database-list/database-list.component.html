<div class="database-container">
  <div class="header">
    <h1>Datenbanken-Verwaltung</h1>
    <div class="actions" *ngIf="isTutor">
      <button mat-raised-button color="primary" (click)="openUploadDialog()">
        <mat-icon>upload_file</mat-icon>
        SQL-Datei hochladen
      </button>
      <button mat-raised-button color="accent" (click)="openCreateDialog()">
        <mat-icon>add</mat-icon>
        Neue Datenbank erstellen
      </button>
    </div>
  </div>

  <div class="database-grid">
    <mat-card class="database-card" *ngFor="let database of databases" (click)="openDatabase(database)">
      <mat-card-header>
        <mat-card-title>{{ database.name }}</mat-card-title>
        <mat-card-subtitle>Erstellt: {{ database.createdAt | date:'medium' }}</mat-card-subtitle>
        <div class="header-actions" *ngIf="isTutor">
          <button
            mat-icon-button
            color="accent"
            (click)="openEditDialog(database); $event.stopPropagation()"
            matTooltip="Bearbeiten">
            <mat-icon>edit</mat-icon>
          </button>
        </div>
      </mat-card-header>
      
      <mat-card-content>
        <p class="description">{{ database.description || 'Keine Beschreibung verfügbar' }}</p>
      </mat-card-content>
      
      <mat-card-actions *ngIf="isTutor">
        <button
          mat-button
          color="warn"
          (click)="deleteDatabase(database.id); $event.stopPropagation()"
          class="delete-btn">
          <mat-icon>delete</mat-icon>
          Datenbank löschen
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
