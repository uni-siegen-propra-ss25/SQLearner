<div class="ai-gen-dialog-wrapper">
  <h2 mat-dialog-title>Aufgabe mit KI generieren</h2>
  <mat-dialog-content [formGroup]="generationForm">
    <div class="form-row">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Schwierigkeit</mat-label>
        <mat-select formControlName="difficulty">
          <mat-option value="EASY">Einfach</mat-option>
          <mat-option value="MEDIUM">Mittel</mat-option>
          <mat-option value="HARD">Schwer</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Datenbank</mat-label>
      <mat-select formControlName="databaseId" required>
        <mat-option *ngFor="let db of data.databases" [value]="db.id">{{ db.name }}</mat-option>
      </mat-select>
      <mat-error
        *ngIf="
          generationForm.get('databaseId')?.hasError('required') &&
          generationForm.get('databaseId')?.touched
        "
      >
        Datenbank muss ausgewählt werden
      </mat-error>
    </mat-form-field>

    <div class="sql-options-row">
      <mat-form-field appearance="outline" class="half-width">
        <mat-label>SQL-Syntaxelemente (optional)</mat-label>
        <mat-select formControlName="syntaxElements" multiple>
          <mat-option *ngFor="let s of syntaxElements" [value]="s">{{ s }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="half-width">
        <mat-label>SQL-Konzepte (optional)</mat-label>
        <mat-select formControlName="sqlConcepts" multiple>
          <mat-option *ngFor="let c of sqlConcepts" [value]="c">{{ c }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div *ngIf="error" class="error">{{ error }}</div>
  </mat-dialog-content>
</div>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Abbrechen</button>
  <button
    mat-flat-button
    color="primary"
    (click)="generate()"
    [disabled]="isLoading || generationForm.invalid"
  >
    <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
    <span *ngIf="!isLoading">Generieren</span>
  </button>
</mat-dialog-actions>
