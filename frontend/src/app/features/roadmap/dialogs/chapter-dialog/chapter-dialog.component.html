<h2 mat-dialog-title>{{ isEditing ? ('CHAPTER_DIALOG.EDIT_TITLE' | translate) : ('CHAPTER_DIALOG.NEW_TITLE' | translate) }}</h2>
<form [formGroup]="chapterForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'CHAPTER_DIALOG.TITLE' | translate }}</mat-label>
      <input matInput formControlName="title" [placeholder]="'CHAPTER_DIALOG.TITLE_PLACEHOLDER' | translate" />
      <mat-error *ngIf="chapterForm.get('title')?.hasError('required')">
        {{ 'CHAPTER_DIALOG.TITLE_REQUIRED' | translate }}
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'CHAPTER_DIALOG.DESCRIPTION' | translate }}</mat-label>
      <textarea
        matInput
        formControlName="description"
        [placeholder]="'CHAPTER_DIALOG.DESCRIPTION_PLACEHOLDER' | translate"
        rows="4"
      >
      </textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">{{ 'CHAPTER_DIALOG.CANCEL' | translate }}</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="chapterForm.invalid">
      {{ isEditing ? ('CHAPTER_DIALOG.SAVE' | translate) : ('CHAPTER_DIALOG.CREATE' | translate) }}
    </button>
  </mat-dialog-actions>
</form>
