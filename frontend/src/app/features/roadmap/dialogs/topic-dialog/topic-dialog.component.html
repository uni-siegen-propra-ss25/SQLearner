<h2 mat-dialog-title>
  {{ isEditing ? ('TOPIC_DIALOG.EDIT_TITLE' | translate) : ('TOPIC_DIALOG.NEW_TITLE' | translate) }}
</h2>
<form [formGroup]="topicForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'TOPIC_DIALOG.TITLE' | translate }}</mat-label>
      <input
        matInput
        formControlName="title"
        [placeholder]="'TOPIC_DIALOG.TITLE_PLACEHOLDER' | translate"
      />
      <mat-error *ngIf="topicForm.get('title')?.hasError('required')">
        {{ 'TOPIC_DIALOG.TITLE_REQUIRED' | translate }}
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'TOPIC_DIALOG.DESCRIPTION' | translate }}</mat-label>
      <textarea
        matInput
        formControlName="description"
        [placeholder]="'TOPIC_DIALOG.DESCRIPTION_PLACEHOLDER' | translate"
        rows="4"
      >
      </textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">{{ 'TOPIC_DIALOG.CANCEL' | translate }}</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="topicForm.invalid">
      {{ isEditing ? ('TOPIC_DIALOG.SAVE' | translate) : ('TOPIC_DIALOG.CREATE' | translate) }}
    </button>
  </mat-dialog-actions>
</form>
