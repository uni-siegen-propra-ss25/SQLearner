<div class="profile-container" *ngIf="user">
  <mat-card class="profile-card">
    <mat-card-header>
      <div mat-card-avatar class="profile-avatar">
        <mat-icon>person</mat-icon>
      </div>
      <mat-card-title>{{ user.firstName }} {{ user.lastName }}</mat-card-title>
      <mat-card-subtitle>{{ 'PROFILE_DIALOG.' + user.role | translate }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="profile-info-row">
        <mat-icon>email</mat-icon>
        <span>{{ user.email }}</span>
      </div>

      <div class="profile-info-row" *ngIf="user.role === 'STUDENT'">
        <mat-icon>badge</mat-icon>
        <span>{{ 'PROFILE_DIALOG.MATRICULATION_NUMBER' | translate }}: {{ user.matriculationNumber || '-' }}</span>
      </div>

      <!-- Temporarily disabled until completedExercises is implemented
      <div class="profile-info-row">
        <mat-icon>calendar_today</mat-icon>
        <span>{{ 'PROFILE_DIALOG.REGISTERED_SINCE' | translate }}: {{ getRegistrationDate() }}</span>
      </div>

      <div class="profile-info-row" *ngIf="user.lastLogin">
        <mat-icon>login</mat-icon>
        <span>{{ 'PROFILE_DIALOG.LAST_LOGIN' | translate }}: {{ user.lastLogin | date:'dd.MM.yyyy HH:mm' }}</span>
      </div>

      <div class="profile-info-row" *ngIf="user.role === 'STUDENT'">
        <mat-icon>military_tech</mat-icon>
        <span>{{ 'PROFILE_DIALOG.COMPLETED_EXERCISES' | translate }}: {{ user.completedExercises || 0 }}</span>
      </div>
      -->
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-stroked-button color="primary" mat-dialog-close>{{ 'PROFILE_DIALOG.CLOSE' | translate }}</button>
      <button mat-stroked-button color="warn" (click)="logout()">
        <mat-icon>logout</mat-icon>
        {{ 'PROFILE_DIALOG.LOGOUT' | translate }}
      </button>
    </mat-card-actions>
  </mat-card>
</div>
